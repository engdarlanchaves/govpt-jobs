name: Pipeline de Concursos (listagens)

on:
  schedule:
    - cron: '40 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31" "pypdf>=4.0" "pdfplumber>=0.11" "supabase>=2.4" "openpyxl>=3.1"

      - name: Verificar secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Faltam SUPABASE_URL e/ou SUPABASE_SERVICE_ROLE_KEY (Settings - Secrets - Actions)."
            exit 1
          fi
          echo "Secrets OK. URL prefixo: ${SUPABASE_URL:0:28}..."

      - name: Pipeline principal (anuncios + PDFs)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: python -u scripts/atualizar_concursos.py

      - name: Extensao fontes publicas (alteracoes + contratos)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: python -u scripts/ext_oportunidades_fontes.py
