name: Pipeline de Concursos (listagens)

on:
  schedule:
    - cron: '40 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31" "pypdf>=4.0" "pdfplumber>=0.11" "supabase>=2.4" "openpyxl>=3.1"

      - name: Verificar secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Faltam SUPABASE_URL e/ou SUPABASE_SERVICE_ROLE_KEY (Settings - Secrets - Actions)."
            exit 1
          fi
          echo "Secrets OK. URL prefixo: ${SUPABASE_URL:0:28}..."

      - name: Sincronizar scripts do repo fonte (conta A)
        env:
          SOURCE_TOKEN: ${{ secrets.GOVPT_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_TOKEN:-}" ]; then
            echo "GOVPT_SOURCE_TOKEN em falta — a usar scripts/ ja no repo (se existirem)."
            ls -la scripts || true
            exit 0
          fi
          mkdir -p scripts
          REF="${SOURCE_REF:-restore-21d98db}"
          for f in atualizar_concursos.py ext_oportunidades_fontes.py export_concursos_abertos.py; do
            echo "A descarregar scripts/$f (ref=$REF)..."
            curl -fsSL \
              -H "Authorization: Bearer $SOURCE_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/Darlanchavess/Gov.pt/contents/scripts/$f?ref=$REF" \
              -o "scripts/$f"
            test -s "scripts/$f"
            echo "  OK $(wc -c < scripts/$f) bytes"
          done

      - name: Pipeline principal (anuncios + PDFs)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: python -u scripts/atualizar_concursos.py

      - name: Extensao fontes publicas (alteracoes + contratos)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: python -u scripts/ext_oportunidades_fontes.py
